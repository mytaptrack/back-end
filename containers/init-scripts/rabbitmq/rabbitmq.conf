# RabbitMQ Configuration for MyTapTrack

# Networking
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and disk limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0

# Clustering (disabled for single node)
cluster_formation.peer_discovery_backend = classic_config

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.file = false

# Connection limits and recovery
num_acceptors.tcp = 10
handshake_timeout = 10000
heartbeat = 60
connection_backlog = 128

# Channel limits
channel_max = 2047
channel_operation_timeout = 15000

# Queue settings
queue_master_locator = min-masters
queue_index_embed_msgs_below = 4096

# Message store
msg_store_file_size_limit = 16777216
msg_store_index_module = rabbit_msg_store_ets_index

# Memory management
vm_memory_calculation_strategy = rss
vm_memory_high_watermark_paging_ratio = 0.5

# Disk monitoring
disk_monitor_failure_retries = 10
disk_monitor_failure_retry_interval = 120000

# TCP configuration for better performance
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0
tcp_listen_options.exit_on_close = false

# Management plugin configuration
management.rates_mode = detailed
management.sample_retention_policies.global.minute = 5
management.sample_retention_policies.global.hour = 60
management.sample_retention_policies.global.day = 1200

# Mirroring and HA
mirroring_sync_batch_size = 4096

# Garbage collection
collect_statistics_interval = 5000

# Plugin configuration
management_agent.disable_metrics_collector = false

# Dead lettering
dead_letter_worker_publisher_confirm_timeout = 180000

# Recovery and retry configuration
consumer_timeout = 900000
consumer_prefetch_count = 250

# Shovel plugin (for metrics forwarding)
# shovel.prefetch_count = 1000

# Federation plugin (for monitoring replication)
# federation.use_reply_to = true
# Secure Secret Management Configuration
# Supports Docker Secrets, HashiCorp Vault, and environment-based secrets

version: '3.8'

# Docker Secrets configuration
secrets:
  # Database credentials
  mongodb_root_password:
    external: true
    name: mytaptrack_mongodb_root_password
  
  mongodb_app_password:
    external: true
    name: mytaptrack_mongodb_app_password
    
  # Message broker credentials
  rabbitmq_admin_password:
    external: true
    name: mytaptrack_rabbitmq_admin_password
    
  rabbitmq_app_password:
    external: true
    name: mytaptrack_rabbitmq_app_password
    
  # Redis password
  redis_password:
    external: true
    name: mytaptrack_redis_password
    
  # JWT signing keys
  jwt_private_key:
    external: true
    name: mytaptrack_jwt_private_key
    
  jwt_public_key:
    external: true
    name: mytaptrack_jwt_public_key
    
  # API keys and tokens
  api_encryption_key:
    external: true
    name: mytaptrack_api_encryption_key
    
  # TLS certificates
  tls_certificate:
    external: true
    name: mytaptrack_tls_certificate
    
  tls_private_key:
    external: true
    name: mytaptrack_tls_private_key
    
  # External service credentials
  external_api_keys:
    external: true
    name: mytaptrack_external_api_keys

# Secret management providers configuration
secret_providers:
  # Docker Secrets (default for simple deployments)
  docker_secrets:
    enabled: true
    mount_path: "/run/secrets"
    
  # HashiCorp Vault integration
  vault:
    enabled: false
    address: "${VAULT_ADDR}"
    auth_method: "kubernetes"  # or "token", "aws", etc.
    mount_path: "secret/mytaptrack"
    role: "mytaptrack-app"
    
  # AWS Secrets Manager (for hybrid deployments)
  aws_secrets:
    enabled: false
    region: "${AWS_REGION}"
    secret_prefix: "mytaptrack/"
    
  # Azure Key Vault
  azure_keyvault:
    enabled: false
    vault_url: "${AZURE_KEYVAULT_URL}"
    client_id: "${AZURE_CLIENT_ID}"
    
  # Environment variables (least secure, for development only)
  environment:
    enabled: true
    prefix: "MYTAPTRACK_"
    warn_on_use: true

# Secret rotation configuration
secret_rotation:
  enabled: true
  
  # Rotation schedules (cron format)
  schedules:
    database_passwords: "0 2 1 * *"  # Monthly at 2 AM
    api_keys: "0 2 15 * *"           # Mid-month at 2 AM
    jwt_keys: "0 2 1 */3 *"          # Quarterly at 2 AM
    tls_certificates: "0 2 1 */6 *"  # Semi-annually at 2 AM
    
  # Rotation strategy
  strategy:
    overlap_period: "24h"  # Keep old secrets for 24 hours
    notification_webhook: "${ROTATION_WEBHOOK_URL}"
    
# Secret validation rules
validation:
  # Minimum requirements for secrets
  password_policy:
    min_length: 16
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_symbols: true
    
  # Key requirements
  encryption_keys:
    min_bits: 256
    algorithms: ["AES-256-GCM", "ChaCha20-Poly1305"]
    
  # Certificate requirements
  tls_certificates:
    min_key_size: 2048
    allowed_algorithms: ["RSA", "ECDSA"]
    max_validity_days: 90
    
# Secret access control
access_control:
  # Service-specific secret access
  service_permissions:
    graphql_api:
      secrets:
        - mongodb_app_password
        - jwt_public_key
        - api_encryption_key
        - tls_certificate
        - tls_private_key
        
    rest_api:
      secrets:
        - mongodb_app_password
        - jwt_public_key
        - api_encryption_key
        - tls_certificate
        - tls_private_key
        
    device_api:
      secrets:
        - mongodb_app_password
        - jwt_public_key
        - api_encryption_key
        - tls_certificate
        - tls_private_key
        
    data_processor:
      secrets:
        - mongodb_app_password
        - rabbitmq_app_password
        - api_encryption_key
        
    mongodb:
      secrets:
        - mongodb_root_password
        - mongodb_app_password
        
    rabbitmq:
      secrets:
        - rabbitmq_admin_password
        - rabbitmq_app_password
        
    redis:
      secrets:
        - redis_password
        
  # Audit logging
  audit:
    enabled: true
    log_access: true
    log_rotation: true
    log_failures: true
    retention_days: 90

# Emergency procedures
emergency:
  # Secret compromise response
  compromise_response:
    auto_rotate: true
    notify_admins: true
    revoke_access: true
    
  # Backup and recovery
  backup:
    enabled: true
    encryption: true
    storage: "encrypted_volume"
    retention_days: 30
    
  # Disaster recovery
  disaster_recovery:
    backup_locations: ["primary", "secondary"]
    recovery_time_objective: "1h"
    recovery_point_objective: "15m"
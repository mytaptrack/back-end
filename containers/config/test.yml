# Test Configuration for MyTapTrack Docker Deployment
#
# ⚠️  SECURITY NOTICE ⚠️
# This file may contain test secrets and credentials.
# Ensure no production values are committed to version control.
# Use environment variables for sensitive values: ${SECRET_NAME}

environment: docker
stage: test

# Database Configuration
database:
  provider: mongodb
  mongodb:
    connectionString: ${MONGODB_CONNECTION_STRING:-mongodb://localhost:27017}
    database: mytaptrack_test
    collections:
      primary: primary_data
      data: secondary_data
    options:
      maxPoolSize: 5
      minPoolSize: 1
      maxIdleTimeMS: 30000
      serverSelectionTimeoutMS: 5000
      socketTimeoutMS: 45000
      connectTimeoutMS: 10000
      retryWrites: true
      w: 1
      readPreference: primary

# Message Broker Configuration
messageBroker:
  provider: rabbitmq
  rabbitmq:
    connectionString: ${RABBITMQ_CONNECTION_STRING:-amqp://localhost:5672}
    vhost: mytaptrack_test
    exchanges:
      events: mytaptrack.test.events
      deadLetter: mytaptrack.test.dlx
    queues:
      userEvents: user.test.events
      studentEvents: student.test.events
      licenseEvents: license.test.events
      reportEvents: report.test.events
      appEvents: app.test.events
      deviceEvents: device.test.events
    options:
      heartbeat: 60
      connectionTimeout: 10000
      channelMax: 20
      frameMax: 0x1000
      prefetch: 3

# Authentication Configuration
authentication:
  provider: jwt
  jwt:
    publicKeyPath: ${JWT_PUBLIC_KEY_PATH:-./config/jwt-public.key}
    issuer: ${JWT_ISSUER:-mytaptrack-test}
    audience: ${JWT_AUDIENCE:-mytaptrack-api}
    algorithms: ["RS256", "ES256"]
    clockTolerance: 60
    maxAge: "8h"
  
# Cache Configuration
cache:
  provider: redis
  redis:
    connectionString: ${REDIS_CONNECTION_STRING:-redis://localhost:6379}
    keyPrefix: "mtt:test:"
    defaultTTL: 900
    options:
      retryDelayOnFailover: 100
      enableReadyCheck: true
      maxRetriesPerRequest: 3
      lazyConnect: true
      keepAlive: 30000

# Service Configuration
services:
  graphqlApi:
    port: 4000
    cors:
      origins: ["http://localhost:3000", "http://localhost:3001", "http://localhost:8080", "http://127.0.0.1:3000"]
      credentials: true
      methods: ["GET", "POST", "OPTIONS"]
      allowedHeaders: ["Authorization", "Content-Type", "Accept", "Origin", "User-Agent", "DNT", "Cache-Control", "X-Mx-ReqToken", "Keep-Alive", "X-Requested-With", "If-Modified-Since"]
    rateLimit:
      windowMs: 60000
      maxRequests: 10000
    complexity:
      maximumComplexity: 5000
      maximumDepth: 20
    
  restApi:
    port: 4501
    cors:
      origins: ["http://localhost:3000", "http://localhost:3001", "http://localhost:8080", "http://127.0.0.1:3000"]
      credentials: true
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowedHeaders: ["Authorization", "Content-Type", "Accept", "Origin", "User-Agent", "DNT", "Cache-Control", "X-Mx-ReqToken", "Keep-Alive", "X-Requested-With", "If-Modified-Since"]
    rateLimit:
      windowMs: 60000
      maxRequests: 20000
    
  deviceApi:
    port: 4502
    rateLimit:
      windowMs: 60000
      maxRequests: 50000
    timeout: 60000
    
  dataProcessor:
    batchSize: ${BATCH_SIZE:-3}
    retryAttempts: ${RETRY_ATTEMPTS:-1}
    retryDelay: ${RETRY_DELAY:-1000}
    deadLetterThreshold: 2
    processingTimeout: 15000

# Logging Configuration
logging:
  level: ${LOG_LEVEL:-debug}
  format: pretty
  timestamp: true
  correlationId: true
  includeStack: true
  destinations:
    - console
  fields:
    service: ${SERVICE_NAME:-mytaptrack-test}
    environment: test
    version: ${APP_VERSION:-test}

# Security Configuration
security:
  encryption:
    algorithm: aes-256-gcm
    keyRotation: false
  secrets:
    provider: env
  network:
    allowedOrigins: ["*"]
    rateLimiting: false
    ddosProtection: false
  
# Health Check Configuration
healthCheck:
  enabled: true
  interval: 10000
  timeout: 2000
  retries: 1
  checks:
    - database
    - messageBroker
    - cache

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: /metrics
  tracing:
    enabled: false
  profiling:
    enabled: false

# Development Features
development:
  hotReload: false
  mockData: true
  debugMode: true
  verboseLogging: true

# Application Configuration
app:
  name: MyTapTrack Test
  version: ${APP_VERSION:-test}
  student:
    removeTimeout: ${STUDENT_REMOVE_TIMEOUT:-60000}
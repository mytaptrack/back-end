# Production Configuration for MyTapTrack Docker Deployment

environment: docker
stage: production

# Database Configuration
database:
  provider: mongodb
  mongodb:
    connectionString: ${MONGODB_CONNECTION_STRING}
    database: mytaptrack
    collections:
      primary: primary_data
      data: secondary_data
    options:
      maxPoolSize: 20
      minPoolSize: 5
      maxIdleTimeMS: 30000
      serverSelectionTimeoutMS: 5000
      socketTimeoutMS: 45000
      connectTimeoutMS: 10000
      retryWrites: true
      w: majority
      readPreference: primary

# Message Broker Configuration
messageBroker:
  provider: rabbitmq
  rabbitmq:
    connectionString: ${RABBITMQ_CONNECTION_STRING}
    vhost: mytaptrack
    exchanges:
      events: mytaptrack.events
      deadLetter: mytaptrack.dlx
    queues:
      userEvents: user.events
      studentEvents: student.events
      licenseEvents: license.events
      reportEvents: report.events
      appEvents: app.events
      deviceEvents: device.events
    options:
      heartbeat: 60
      connectionTimeout: 10000
      channelMax: 100
      frameMax: 0x1000
      prefetch: 10

# Authentication Configuration
authentication:
  provider: jwt
  jwt:
    publicKeyPath: ${JWT_PUBLIC_KEY_PATH}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    algorithms: ["RS256", "ES256"]
    clockTolerance: 30
    maxAge: "1h"
  
# Cache Configuration
cache:
  provider: redis
  redis:
    connectionString: ${REDIS_CONNECTION_STRING}
    keyPrefix: "mtt:prod:"
    defaultTTL: 3600
    options:
      retryDelayOnFailover: 100
      enableReadyCheck: true
      maxRetriesPerRequest: 3
      lazyConnect: true
      keepAlive: 30000

# Service Configuration
services:
  graphqlApi:
    port: 4000
    cors:
      origins: ${CORS_ORIGINS}
      credentials: true
      methods: ["GET", "POST", "OPTIONS"]
      allowedHeaders: ["Authorization", "Content-Type", "Accept", "Origin", "User-Agent", "DNT", "Cache-Control", "X-Mx-ReqToken", "Keep-Alive", "X-Requested-With", "If-Modified-Since"]
    rateLimit:
      windowMs: 60000
      maxRequests: 100
    complexity:
      maximumComplexity: 1000
      maximumDepth: 10
    
  restApi:
    port: 4501
    cors:
      origins: ${CORS_ORIGINS}
      credentials: true
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowedHeaders: ["Authorization", "Content-Type", "Accept", "Origin", "User-Agent", "DNT", "Cache-Control", "X-Mx-ReqToken", "Keep-Alive", "X-Requested-With", "If-Modified-Since"]
    rateLimit:
      windowMs: 60000
      maxRequests: 200
    
  deviceApi:
    port: 4502
    rateLimit:
      windowMs: 60000
      maxRequests: 500
    timeout: 30000
    
  dataProcessor:
    batchSize: ${BATCH_SIZE:-10}
    retryAttempts: ${RETRY_ATTEMPTS:-3}
    retryDelay: ${RETRY_DELAY:-5000}
    deadLetterThreshold: 5
    processingTimeout: 60000

# Logging Configuration
logging:
  level: ${LOG_LEVEL:-info}
  format: json
  timestamp: true
  correlationId: true
  includeStack: false
  destinations:
    - console
  fields:
    service: ${SERVICE_NAME}
    environment: production
    version: ${APP_VERSION:-1.0.0}

# Security Configuration
security:
  encryption:
    algorithm: aes-256-gcm
    keyRotation: true
  secrets:
    provider: docker-secrets
  network:
    allowedOrigins: ${CORS_ORIGINS}
    rateLimiting: true
    ddosProtection: true
  
# Health Check Configuration
healthCheck:
  enabled: true
  interval: 30000
  timeout: 5000
  retries: 3
  checks:
    - database
    - messageBroker
    - cache
    - authentication

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: /metrics
  tracing:
    enabled: false
  profiling:
    enabled: false
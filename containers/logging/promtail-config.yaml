  # Application-specific log parsing for structured logs
  - job_name: mytaptrack-structured
    static_configs:
      - targets:
          - localhost
        labels:
          job: mytaptrack-structured
          __path__: /var/lib/docker/containers/*mytaptrack*/*.log
    pipeline_stages:
      - json:
          expressions:
            container_log: log
            stream: stream
            timestamp: time
      - json:
          source: container_log
          expressions:
            level: level
            service: service
            message: message
            correlation_id: correlationId
            user_id: userId
            request_id: requestId
            error_name: error.name
            error_message: error.message
            performance_operation: performance.operation
            performance_duration: performance.duration
      - labels:
          level:
          service:
          correlation_id:
          user_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message
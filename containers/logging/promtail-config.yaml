# Promtail Configuration for MyTapTrack Container Log Collection
# Collects logs from all MyTapTrack services and forwards to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # MyTapTrack GraphQL API logs
  - job_name: graphql-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: graphql-api
          service: mytaptrack-graphql-api
          environment: ${ENVIRONMENT:-production}
          __path__: /var/lib/docker/containers/*graphql-api*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output

  # MyTapTrack REST API logs
  - job_name: rest-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: rest-api
          service: mytaptrack-rest-api

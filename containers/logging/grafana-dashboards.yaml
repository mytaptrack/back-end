# Grafana Dashboards Configuration
# Provisions MyTapTrack monitoring dashboards

apiVersion: 1

providers:
  - name: 'MyTapTrack Dashboards'
    orgId: 1
    folder: 'MyTapTrack'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
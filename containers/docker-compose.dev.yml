services:
  # Load Balancer / Reverse Proxy (Development)
  nginx-proxy:
    image: nginx:alpine
    container_name: mytaptrack-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - graphql-api
      - rest-api
      - device-api
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GraphQL API Service (Development)
  graphql-api:
    build:
      context: ..
      dockerfile: containers/graphql-api/Dockerfile
      target: development
    container_name: mytaptrack-graphql-api-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=graphql-api
      - PORT=4500
      - DATABASE_PROVIDER=mongodb
      - MESSAGE_BROKER_PROVIDER=rabbitmq
      - AUTH_PROVIDER=jwt
      - CACHE_PROVIDER=redis
      - MONGODB_CONNECTION_STRING=mongodb://admin:devpassword@mongodb:27017/mytaptrack_dev?authSource=admin
      - RABBITMQ_CONNECTION_STRING=amqp://admin:devpassword@rabbitmq:5672
      - REDIS_CONNECTION_STRING=redis://redis:6379
      - JWT_PUBLIC_KEY_PATH=/app/config/jwt-public.key
      - JWT_ISSUER=mytaptrack-dev
      - JWT_AUDIENCE=mytaptrack-api-dev
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../business-logic:/app/business-logic:cached
      - ../lib:/app/lib:cached
      - ../types:/app/types:cached
      - ../api/src/graphql:/app/graphql:cached
      - ./config/development.yml:/app/config/config.yml:ro
      - ./config/jwt-public.key:/app/config/jwt-public.key:ro
      - /app/node_modules
    ports:
      - "4500:4500"
      - "9229:9229"  # Node.js debugger port
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    command: npm run dev:debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # REST API Service (Development)
  rest-api:
    build:
      context: ..
      dockerfile: containers/rest-api/Dockerfile
      target: development
    container_name: mytaptrack-rest-api-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=rest-api
      - PORT=4501
      - DATABASE_PROVIDER=mongodb
      - MESSAGE_BROKER_PROVIDER=rabbitmq
      - AUTH_PROVIDER=jwt
      - CACHE_PROVIDER=redis
      - MONGODB_CONNECTION_STRING=mongodb://admin:devpassword@mongodb:27017/mytaptrack_dev?authSource=admin
      - RABBITMQ_CONNECTION_STRING=amqp://admin:devpassword@rabbitmq:5672
      - REDIS_CONNECTION_STRING=redis://redis:6379
      - JWT_PUBLIC_KEY_PATH=/app/config/jwt-public.key
      - JWT_ISSUER=mytaptrack-dev
      - JWT_AUDIENCE=mytaptrack-api-dev
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../business-logic:/app/business-logic:cached
      - ../lib:/app/lib:cached
      - ../types:/app/types:cached
      - ../api/src/v2:/app/api:cached
      - ./config/development.yml:/app/config/config.yml:ro
      - ./config/jwt-public.key:/app/config/jwt-public.key:ro
      - /app/node_modules
    ports:
      - "4501:4501"
      - "9230:9229"  # Node.js debugger port
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    command: npm run dev:debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Device API Service (Development)
  device-api:
    build:
      context: ..
      dockerfile: containers/device-api/Dockerfile
      target: development
    container_name: mytaptrack-device-api-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=device-api
      - PORT=4502
      - DATABASE_PROVIDER=mongodb
      - MESSAGE_BROKER_PROVIDER=rabbitmq
      - AUTH_PROVIDER=jwt
      - CACHE_PROVIDER=redis
      - MONGODB_CONNECTION_STRING=mongodb://admin:devpassword@mongodb:27017/mytaptrack_dev?authSource=admin
      - RABBITMQ_CONNECTION_STRING=amqp://admin:devpassword@rabbitmq:5672
      - REDIS_CONNECTION_STRING=redis://redis:6379
      - JWT_PUBLIC_KEY_PATH=/app/config/jwt-public.key
      - JWT_ISSUER=mytaptrack-dev
      - JWT_AUDIENCE=mytaptrack-api-dev
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../business-logic:/app/business-logic:cached
      - ../lib:/app/lib:cached
      - ../types:/app/types:cached
      - ../api/src/device:/app/device:cached
      - ./config/development.yml:/app/config/config.yml:ro
      - ./config/jwt-public.key:/app/config/jwt-public.key:ro
      - /app/node_modules
    ports:
      - "4502:4502"
      - "9231:9229"  # Node.js debugger port
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    command: npm run dev:debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4502/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Data Processor Service (Development)
  data-processor:
    build:
      context: ..
      dockerfile: containers/data-processor/Dockerfile
      target: development
    container_name: mytaptrack-data-processor-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=data-processor
      - DATABASE_PROVIDER=mongodb
      - MESSAGE_BROKER_PROVIDER=rabbitmq
      - CACHE_PROVIDER=redis
      - MONGODB_CONNECTION_STRING=mongodb://admin:devpassword@mongodb:27017/mytaptrack_dev?authSource=admin
      - RABBITMQ_CONNECTION_STRING=amqp://admin:devpassword@rabbitmq:5672
      - REDIS_CONNECTION_STRING=redis://redis:6379
      - LOG_LEVEL=debug
      - BATCH_SIZE=5
      - RETRY_ATTEMPTS=2
      - RETRY_DELAY=3000
      - HOT_RELOAD=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../business-logic:/app/business-logic:cached
      - ../lib:/app/lib:cached
      - ../types:/app/types:cached
      - ./config/development.yml:/app/config/config.yml:ro
      - /app/node_modules
    ports:
      - "9232:9229"  # Node.js debugger port
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    command: npm run dev:debug
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database (Development)
  mongodb:
    image: mongo:6.0
    container_name: mytaptrack-mongodb-dev
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword
      - MONGO_INITDB_DATABASE=mytaptrack_dev
    volumes:
      - mongodb_dev_data:/data/db
      - ./init-scripts/mongodb/dev-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27018:27017"
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # RabbitMQ Message Broker (Development)
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: mytaptrack-rabbitmq-dev
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=devpassword
      - RABBITMQ_DEFAULT_VHOST=mytaptrack_dev
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=15672
      - RABBITMQ_VHOST=mytaptrack_dev
      - MYTAPTRACK_APP_PASSWORD=dev_app_password
      - ENVIRONMENT=development
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
      - ./init-scripts/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./init-scripts/rabbitmq/dev-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./init-scripts/rabbitmq/init-rabbitmq.sh:/etc/rabbitmq/init-rabbitmq.sh:ro
      - ./init-scripts/rabbitmq/health-check.sh:/etc/rabbitmq/health-check.sh:ro
      - ./init-scripts/rabbitmq/monitoring-setup.sh:/etc/rabbitmq/monitoring-setup.sh:ro
      - ./init-scripts/rabbitmq/connection-recovery.sh:/etc/rabbitmq/connection-recovery.sh:ro
      - /var/log/rabbitmq-dev:/var/log/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/etc/rabbitmq/health-check.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: mytaptrack-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Development Tools
  mongo-express:
    image: mongo-express:latest
    container_name: mytaptrack-mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=devpassword
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=devpassword
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Redis Commander for Redis inspection
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    container_name: mytaptrack-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Log aggregation with Loki
  loki:
    image: grafana/loki:2.9.0
    container_name: mytaptrack-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./dev-tools/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Log viewer with Grafana
  grafana:
    image: grafana/grafana:10.1.0
    container_name: mytaptrack-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=devpassword
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dev-tools/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./dev-tools/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dev-tools/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: mytaptrack-promtail
    volumes:
      - ./dev-tools/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - mytaptrack-dev-network
    restart: unless-stopped

  # Development utilities container
  dev-tools:
    build:
      context: ..
      dockerfile: containers/dev-tools/Dockerfile
    container_name: mytaptrack-dev-tools
    environment:
      - MONGODB_CONNECTION_STRING=mongodb://admin:devpassword@mongodb:27017/mytaptrack_dev?authSource=admin
      - RABBITMQ_CONNECTION_STRING=amqp://admin:devpassword@rabbitmq:5672
      - REDIS_CONNECTION_STRING=redis://redis:6379
    volumes:
      - ../containers/scripts:/app/scripts:cached
      - ./dev-tools:/app/dev-tools:cached
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - mytaptrack-dev-network
    restart: "no"
    profiles:
      - tools

volumes:
  mongodb_dev_data:
    driver: local
  rabbitmq_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  mytaptrack-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
      primary:
        access: read
  getReportData:
    handler: 'src/graphql/resolver/query/getReportData/get-report-data.ts'
    tables:
      data:
        access: read
      primary:
        access: read

Mutation:
  updateNotes:
    handler: 'src/graphql/resolver/mutations/report/notes.ts'
    tables:
      data:
        access: read
      primary:
        access: readWrite
  updateReportDateInclusion:
    handler: 'src/graphql/resolver/mutations/report/date-inclusion.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateExcludeDate:
    handler: 'src/graphql/resolver/mutations/report/update-exclude-date.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateUserBehaviorDashboardSettings:
    handler: 'src/graphql/resolver/mutations/user/dashboard.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateStudent:
    handler: 'src/graphql/resolver/mutations/student/update-info/data.ts'
    tables:
      data:
        access: readWrite
        indexes: ['', 'License']
      primary:
        access: readWrite
  deleteStudent:
    handler: 'src/graphql/resolver/mutations/student/update-info/delete.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  deleteStudentTeamMember:
    handler: 'src/graphql/resolver/mutations/student/delete-team-member.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateStudentTeamMember:
    handler: 'src/graphql/resolver/mutations/student/update-team-member.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateSnapshot:
    handler: 'src/graphql/resolver/mutations/snapshot/save.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateDataInReport:
    handler: 'src/graphql/resolver/mutations/report/data.ts'
    tables:
      data:
        access: readWrite
        indexes: ['', 'Student', 'License']
      primary:
        access: readWrite
    eventBus:
      access: sendMessage
    sqs:
      - name: reportDataQueue
        access: 0
    policyStatements:
      - actions:
          - events:PutEvents
        resources: 
          - arn:aws:events:${context.region}:${this.account}:event-bus/*
        
  updateReportDaySchedule:
    handler: 'src/graphql/resolver/mutations/report/schedule.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  deleteNotifications:
    handler: 'src/graphql/resolver/mutations/student/notifications/delete-notifications.ts'
    tables:
      data:
        access: readWrite
        indexes: ['', 'Device']
      primary:
        access: readWrite
  updateApp:
    handler: 'src/graphql/resolver/mutations/app/update.ts'
    tables:
      data:
        access: readWrite
        indexes: ['', 'Device']
      primary:
        access: readWrite
  acceptUserTerms:
    handler: 'src/graphql/resolver/mutations/user/accept-terms.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateUser:
    handler: 'src/graphql/resolver/mutations/user/info.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
    cognito: 0
  userLicenseChange:
    handler: 'src/graphql/resolver/mutations/license/license-updated.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  changeLicense:
    handler: 'src/graphql/resolver/mutations/license/change-license.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
    cognito: 1
  emailSupport:
    handler: 'src/graphql/resolver/mutations/support/email.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateInvite:
    handler: 'src/graphql/resolver/mutations/user/invite.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateManageAbc:
    handler: 'src/graphql/resolver/mutations/manage/update-manage-abc.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  updateReportsData:
    handler: 'src/graphql/resolver/mutations/reports/update-reports-data.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite
  createSnapshot:
    handler: 'src/graphql/resolver/mutations/snapshot/create-snapshot.ts'
    tables:
      data:
        access: readWrite
      primary:
        access: readWrite

Subscription:
  onStudentNote:
    handler: 'src/graphql/resolver/subscriptions/report/notes.ts'
    tables:
      data:
        access: read
      primary:
        access: read

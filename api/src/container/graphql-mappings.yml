# GraphQL Resolver Mappings for Container Mode
# Organized by GraphQL type with field names as keys and detailed configuration as values

Query:
  getGlobalServiceReport:
    handler: 'src/graphql/resolver/query/getGlobalServiceReport/data.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getStudents:
    handler: 'src/graphql/resolver/query/getStudent/get-students.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  findStudent:
    handler: 'src/graphql/resolver/query/getStudent/find-students.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getLicenses:
    handler: 'src/graphql/resolver/query/getLicenses/data.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getStudent:
    handler: 'src/graphql/resolver/query/getStudent/data.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getData:
    handler: 'src/graphql/resolver/query/getData/data.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getNotes:
    handler: 'src/graphql/resolver/query/getData/notes.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getStudentSources:
    handler: 'src/graphql/resolver/query/getStudent/data-sources.ts'
    tables:
      data:
        access: read
        indexes: ['', 'Student']
      primary:
        access: read
  listSnapshots:
    handler: 'src/graphql/resolver/query/getSnapshot/list.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getSnapshot:
    handler: 'src/graphql/resolver/query/getSnapshot/get.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getAppList:
    handler: 'src/graphql/resolver/query/getDevices/apps.ts'
    tables:
      data:
        access: read
        indexes: ['', 'Device']
      primary:
        access: read
  getApp:
    handler: 'src/graphql/resolver/query/getDevices/app.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getAppToken:
    handler: 'src/graphql/resolver/query/getDevices/appToken.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getAppsForDevice:
    handler: 'src/graphql/resolver/query/getDevices/apps-for-device.ts'
    tables:
      data:
        access: read
        indexes: ['', 'Device']
      primary:
        access: read
  getAppsForLicense:
    handler: 'src/graphql/resolver/query/getDevices/apps-for-license.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getTrackForDevice:
    handler: 'src/graphql/resolver/query/getDevices/track-for-dsn.ts'
    tables:
      data:
        access: read
        indexes: ['', 'Device']
      primary:
        access: read
  getSubscriptionsForStudent:
    handler: 'src/graphql/resolver/query/getStudent/subscriptions.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getUsersForLicense:
    handler: 'src/graphql/resolver/query/getUsers/manage.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getServerSettings:
    handler: 'src/graphql/resolver/query/getServerSettings/data.ts'
    tables:
      data:
        access: read
      primary:
        access: read
    ssm:
      - name: https_key
  getUser:
    handler: 'src/graphql/resolver/query/getUsers/current.ts'
    tables:
      data:
        access: read
      primary:
        access: read
    cognito: 2
  getUserPaymentSession:
    handler: 'src/graphql/resolver/query/getUsers/payment-session.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getManageStudents:
    handler: 'src/graphql/resolver/query/getManageStudents/get-manage-students.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getManageStats:
    handler: 'src/graphql/resolver/query/getManageStats/get-manage-stats.ts'
    tables:
      data:
        access: read
        indexes: ['', 'License']
      primary:
        access: read
  getLicenseDetails:
    handler: 'src/graphql/resolver/query/getLicenseDetails/get-license-details.ts'
    tables:
      data:
        access: read
      primary:
        access: read
  getStudentTeam:
    handler: 'src/graphql/resolver/query/getStudentTeam/get-student-team.ts'

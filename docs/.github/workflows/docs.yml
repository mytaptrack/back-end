name: Documentation Build and Deploy

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'docs/**'
      - 'api/src/graphql/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths: 
      - 'docs/**'
      - 'api/src/graphql/**'

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
        
    - name: Install dependencies
      run: |
        cd docs
        npm ci
        
    - name: Generate API documentation
      run: |
        cd docs
        npm run generate-api-docs
        
    - name: Validate links
      run: |
        cd docs
        npm run validate-links
        
    - name: Validate diagrams
      run: |
        cd docs
        npm run validate-diagrams
        
    - name: Build documentation
      run: |
        cd docs
        npm run build

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
        
    - name: Install dependencies
      run: |
        cd docs
        npm ci
        
    - name: Generate API documentation
      run: |
        cd docs
        npm run generate-api-docs
        
    - name: Build documentation
      run: |
        cd docs
        npm run build
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Deploy to S3 staging
      run: |
        aws s3 sync docs/build/ s3://mytaptrack-docs-staging --delete
        aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_ID }} --paths "/*"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
        
    - name: Install dependencies
      run: |
        cd docs
        npm ci
        
    - name: Generate API documentation
      run: |
        cd docs
        npm run generate-api-docs
        
    - name: Build documentation
      run: |
        cd docs
        npm run build
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Deploy to S3 production
      run: |
        aws s3 sync docs/build/ s3://mytaptrack-docs-production --delete
        aws cloudfront create-invalidation --distribution-id ${{ secrets.PRODUCTION_CLOUDFRONT_ID }} --paths "/*"
        
    - name: Update search index
      run: |
        # Trigger Algolia reindexing
        curl -X POST "https://crawler.algolia.com/api/1/crawlers/${{ secrets.ALGOLIA_CRAWLER_ID }}/reindex" \
          -H "Authorization: Bearer ${{ secrets.ALGOLIA_API_KEY }}"
# AWS Development Configuration for MyTapTrack
#
# ⚠️  SECURITY NOTICE ⚠️
# This file may contain development secrets and credentials.
# Ensure no production values are committed to version control.
# Use environment variables for sensitive values: ${SECRET_NAME}

environment: aws
stage: dev
region: us-west-2

# Database Configuration
database:
  provider: dynamodb
  dynamodb:
    region: us-west-2
    tables:
      primary: mytaptrack-dev-primary
      data: mytaptrack-dev-data

# Message Broker Configuration
messageBroker:
  provider: eventbridge
  eventbridge:
    region: us-west-2
    eventBusName: mytaptrack-dev-events
    source: mytaptrack

# Authentication Configuration
authentication:
  provider: cognito
  cognito:
    region: us-west-2
    userPoolId: ${COGNITO_USER_POOL_ID}
    clientId: ${COGNITO_CLIENT_ID}
    issuer: https://cognito-idp.us-west-2.amazonaws.com/${COGNITO_USER_POOL_ID}

# Cache Configuration
cache:
  provider: dynamodb
  dynamodb:
    region: us-west-2
    tableName: mytaptrack-dev-cache
    ttlAttribute: ttl

# Service Configuration (for local development/testing)
services:
  graphqlApi:
    port: 4000
    cors:
      origins:
        [
          "http://localhost:3000",
          "http://localhost:3001",
          "https://dev.mytaptrack.com",
        ]
      credentials: true
      methods: ["GET", "POST", "OPTIONS"]
      allowedHeaders:
        [
          "Authorization",
          "Content-Type",
          "Accept",
          "Origin",
          "User-Agent",
          "DNT",
          "Cache-Control",
          "X-Mx-ReqToken",
          "Keep-Alive",
          "X-Requested-With",
          "If-Modified-Since",
        ]
    rateLimit:
      windowMs: 60000
      maxRequests: 2000
    complexity:
      maximumComplexity: 3000
      maximumDepth: 15

  restApi:
    port: 4501
    cors:
      origins:
        [
          "http://localhost:3000",
          "http://localhost:3001",
          "https://dev.mytaptrack.com",
        ]
      credentials: true
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowedHeaders:
        [
          "Authorization",
          "Content-Type",
          "Accept",
          "Origin",
          "User-Agent",
          "DNT",
          "Cache-Control",
          "X-Mx-ReqToken",
          "Keep-Alive",
          "X-Requested-With",
          "If-Modified-Since",
        ]
    rateLimit:
      windowMs: 60000
      maxRequests: 4000

  deviceApi:
    port: 4502
    rateLimit:
      windowMs: 60000
      maxRequests: 10000
    timeout: 60000

# Logging Configuration
logging:
  level: ${LOG_LEVEL:-debug}
  format: json
  timestamp: true
  correlationId: true
  includeStack: true
  destinations:
    - console
    - cloudwatch
  fields:
    service: mytaptrack
    environment: aws-dev
    version: ${APP_VERSION:-dev}

# Security Configuration
security:
  encryption:
    algorithm: aes-256-gcm
    keyRotation: true
  secrets:
    provider: aws-secrets-manager
    awsSecretsManager:
      region: us-west-2
  network:
    allowedOrigins: ["https://dev.mytaptrack.com", "http://localhost:3000"]
    rateLimiting: true
    ddosProtection: true

# Health Check Configuration
healthCheck:
  enabled: true
  interval: 30000
  timeout: 5000
  retries: 3
  checks:
    - database
    - messageBroker
    - cache

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: /metrics
  tracing:
    enabled: true
    provider: aws-xray
  profiling:
    enabled: false

# Application Configuration
app:
  name: MyTapTrack
  version: ${APP_VERSION:-dev}
  pushSnsArns:
    android: ${ANDROID_SNS_ARN}
    ios: ${IOS_SNS_ARN}
  domain:
    name: ${DOMAIN_NAME}
    hostedZoneId: ${HOSTED_ZONE_ID}
    subdomains:
      api: api-dev
      device: device-dev
      website: dev
  student:
    removeTimeout: ${STUDENT_REMOVE_TIMEOUT:-90000}

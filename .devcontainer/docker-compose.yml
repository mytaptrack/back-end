services:
  workspace:
    # Matches the Lambda runtime major version
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    command: sleep infinity
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      RABBITMQ_URL: amqp://mytaptrack:mytaptrack@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PrimaryTable: mytaptrack-local-primary
      DataTable: mytaptrack-local-data
    volumes:
      - .:/workspaces/back-end:cached
      # Credentials and SSO cache for deploys; read-write because `aws sso login` updates it
      - ${HOME}/.aws:/home/node/.aws
      # Host node_modules are built for macOS, so Linux installs live in volumes
      - node-modules-root:/workspaces/back-end/node_modules
      - node-modules-types:/workspaces/back-end/types/node_modules
      - node-modules-cdk:/workspaces/back-end/cdk/node_modules
      - node-modules-lib:/workspaces/back-end/lib/node_modules
      - node-modules-core:/workspaces/back-end/core/node_modules
      - node-modules-api:/workspaces/back-end/api/node_modules
      - node-modules-data-prop:/workspaces/back-end/data-prop/node_modules
      - node-modules-system-tests:/workspaces/back-end/system-tests/node_modules
      - node-modules-cicd:/workspaces/back-end/cicd/node_modules
      - node-modules-utils:/workspaces/back-end/utils/node_modules
    depends_on:
      - dynamodb-local
      - rabbitmq
      - redis
    networks:
      - mytaptrack-network

volumes:
  node-modules-root:
  node-modules-types:
  node-modules-cdk:
  node-modules-lib:
  node-modules-core:
  node-modules-api:
  node-modules-data-prop:
  node-modules-system-tests:
  node-modules-cicd:
  node-modules-utils:
